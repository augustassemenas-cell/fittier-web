name: Supabase keep-alive

# Pings the FitTier backend once a day so the free Supabase project
# is never auto-paused for inactivity.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive function
        run: curl -fsS --retry 3 --retry-delay 20 https://asukvmavvgbrheesrgbf.supabase.co/functions/v1/keepalive
