name: Deploy fittier.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Keep Apple-required pages (privacy, support) + custom domain
        run: |
          git clone --depth 1 https://github.com/augustassemenas-cell/fittier-site legacy
          cp legacy/privacy.html legacy/support.html dist/
          [ -f dist/style.css ] || cp legacy/style.css dist/
          cp dist/index.html dist/404.html
          echo "fittier.app" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
